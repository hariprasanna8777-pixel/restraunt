{% extends "base.html" %}
{% set title = "Reservations" %}

{% block content %}
<section class="py-5">
  <div class="container">
    <h1 class="fw-semibold mb-2">Reservations</h1>
    <p class="text-muted mb-4">Book a table. Your future self will be weirdly grateful.</p>

    <div class="row g-4">
      <div class="col-lg-7">
        <form method="post" class="p-4 border rounded-4">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Name</label>
              <input name="name" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input name="phone" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Date</label>
              <input name="date" class="form-control" placeholder="YYYY-MM-DD" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Time</label>
              <input name="time" class="form-control" placeholder="7:30 PM" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Party size</label>
              <input name="party_size" type="number" min="1" max="20" class="form-control" required>
            </div>
            <div class="col-12">
              <label class="form-label">Notes (optional)</label>
              <textarea name="notes" class="form-control" rows="3"></textarea>
            </div>
          </div>
          <button class="btn btn-dark rounded-pill px-4 mt-3" type="submit">Request Reservation</button>
        </form>
      </div>

      <div class="col-lg-5">
        <div class="p-4 bg-light rounded-4 h-100">
          <div class="fw-semibold">Reservation policy</div>
          <p class="text-muted small mt-2 mb-0">
            This is a request form. Upgrade later: add availability checks, admin approval, email/SMS confirmations.
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
