{% extends "base.html" %}
{% set title = "Contact" %}

{% block content %}
<section class="py-5">
  <div class="container">
    <h1 class="fw-semibold mb-2">Contact</h1>
    <p class="text-muted mb-4">Ask a question, request catering, or send compliments. Complaints cost extra.</p>

    <div class="row g-4">
      <div class="col-lg-6">
        <form method="post" class="p-4 border rounded-4">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input name="email" type="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea name="message" class="form-control" rows="5" required></textarea>
          </div>
          <button class="btn btn-dark rounded-pill px-4" type="submit">Send</button>
        </form>
      </div>

      <div class="col-lg-6">
        <div class="p-4 bg-light rounded-4 h-100">
          <div class="fw-semibold mb-2">Visit</div>
          <div class="text-muted mb-3">
            12 Example Street, Your City<br>
            +91 98765 43210
          </div>
          <div class="fw-semibold mb-2">Hours</div>
          <div class="text-muted">
            Mon–Thu: 12pm–10pm<br>
            Fri–Sun: 12pm–12am
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
